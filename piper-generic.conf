# The piper-generic output module is based on the generic plugin for Speech
# Dispatcher. There is no code written explicitly for this plugin: all the
# specifics are handled here, and we call a simple command line client to
# perform the actual synthesis. Use this file with the sd_generic output
# module.
#
# Pipeline: speech-dispatcher -> sd_generic -> piper (C++ CLI)
#           --output_raw streams headerless 16-bit little-endian mono PCM
#           on stdout, piped into PulseAudio/PipeWire via pacat.
#
# Two paths are machine-specific — adjust them to yours:
#   1. $PIPER_BIN below (where the `piper` binary lives)
#   2. --model below      (where the voice model lives)
# If `piper --help` fails with "libpiper_phonemize.so.1: cannot open shared
# object file", set LD_LIBRARY_PATH below to the directory holding piper's
# .so files (piper's install dir usually contains a lib/).

# IMPORTANT: the audio playback utility matters.
# We do NOT use $PLAY_COMMAND here: on systems where the raw ALSA route
# (aplay) hangs at device-open, the Pulse route (pacat) is reliable.
# pacat --raw: piper's --output_raw is HEADERLESS PCM, not WAV.

GenericExecuteSynth \
"printf %s \'$DATA\' | LD_LIBRARY_PATH=/home/eonicman/.local/lib /home/eonicman/.local/bin/piper --model /home/eonicman/.local/share/piper/voices/en_US-lessac-medium.onnx --output_raw --quiet --length_scale 1.1 | /usr/bin/pacat --raw --format=s16le --rate=22050 --channels=1 --latency-msec=20"

GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

# Piper handles its own punctuation; punctuation level is not propagated
# (empty GenericPunctNone "" lines trigger parse warnings in sd 0.12, and the
# execute command above never uses $PUNCT anyway).

# AddVoice specifies which $VOICE string should be assigned to
# each language and symbolic voice name.

AddVoice	"en"	"FEMALE1"	"en_US-lessac-medium"

# DefaultVoice specifies which $VOICE string should be used if no voice is
# specified otherwise.

DefaultVoice    "en_US-lessac-medium"
